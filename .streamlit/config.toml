# Pinning the theme so the custom CSS has a known base to sit on. Without this
# the app inherits whatever theme the viewer's Streamlit is set to, and the
# card surfaces and text contrast have to be guessed at.
[theme]
base = "light"
primaryColor = "#EA580C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#111827"

[server]
headless = true

[browser]
gatherUsageStats = false
